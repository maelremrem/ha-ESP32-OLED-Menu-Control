substitutions:
  device_name: ha-menu-c3
  friendly_name: HA Menu C3
  encoder_debounce_ms: "35"
  fw_version: "0.6.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(menu_length) = 0;
          id(menu_synced) = false;
          id(sync_wait_started) = millis();
          id(last_input) = millis();
      - script.execute: boot_led

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

wifi:
  id: wifi_node
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  id: native_api
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    then:
      - delay: 3s
      - homeassistant.event:
          event: esphome.ha_menu_ready
          data:
            device: ${device_name}
  actions:
    - action: set_menu_item
      description: Add or update a menu entry at a given position
      variables:
        slot: int
        item_id: string
        parent_id: string
        label: string
        kind: string
        local_command: string
        confirm: bool
      then:
        - lambda: |-
            if (slot < 0 || slot >= 32 || item_id.empty() || label.empty()) return;
            id(menu_ids)[slot] = item_id.substr(0, 40);
            id(menu_parents)[slot] = parent_id.substr(0, 40);
            id(menu_labels)[slot] = label.substr(0, 64);
            id(menu_kinds)[slot] = kind == "info" || kind == "local" ? kind : "action";
            id(menu_local_commands)[slot] = local_command.substr(0, 24);
            id(menu_confirm)[slot] = confirm ? 1 : 0;
            id(current_page) = "";
            id(cursor) = 0;
            id(transition_direction) = 0;
            // Passive configuration sync must not wake a sleeping device.

    - action: set_control_flags
      description: Enable supported rotary controls for a menu slot
      variables:
        slot: int
        flags: int
      then:
        - lambda: |-
            if (slot >= 0 && slot < 32)
              id(menu_control_flags)[slot] = static_cast<int>(std::clamp<int32_t>(flags, 0, 262143));

    - action: open_controls
      description: Open a native device control screen
      variables:
        slot: int
        flags: int
        brightness: int
        kelvin: int
        hue: int
        temp_x10: int
        humidity: int
        min_kelvin: int
        max_kelvin: int
        min_temp_x10: int
        max_temp_x10: int
        temp_step_x10: int
        min_humidity: int
        max_humidity: int
        humidity_step: int
        modes: string
        current_mode: string
        temp_unit: string
        cover_position: int
        fan_percentage: int
        fan_oscillating: int
        fan_direction: string
        media_volume: int
      then:
        - lambda: |-
            if (slot < 0 || slot >= id(menu_length) || slot != id(control_slot)) return;
            id(control_loading) = false;
            id(control_open) = true;
            id(control_editing) = false;
            id(control_cursor) = 0;
            id(ctrl_fields).clear();
            id(ctrl_modes).clear();
            id(ctrl_flags) = static_cast<int>(std::clamp<int32_t>(flags, 0, 262143));
            for (int bit : {1, 2, 4, 8, 16, 32, 64, 128, 256, 512,
                            1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072})
              if (id(ctrl_flags) & bit) id(ctrl_fields).push_back(bit);
            id(ctrl_brightness) = std::clamp<int32_t>(brightness, 0, 255);
            id(ctrl_cover_position) = std::clamp<int32_t>(cover_position, 0, 100);
            id(ctrl_fan_percentage) = std::clamp<int32_t>(fan_percentage, 0, 100);
            id(ctrl_fan_oscillating) = fan_oscillating != 0;
            id(ctrl_fan_direction) = fan_direction == "reverse" ? "reverse" : "forward";
            id(ctrl_media_volume) = std::clamp<int32_t>(media_volume, 0, 100);
            if (id(ui_direct_edit) && !id(ctrl_fields).empty()) {
              id(control_cursor) = 1;
              id(control_editing) = true;
            }
            id(ctrl_min_kelvin) = std::max(1000, (int)min_kelvin);
            id(ctrl_max_kelvin) = std::max(id(ctrl_min_kelvin), (int)max_kelvin);
            id(ctrl_kelvin) = std::clamp((int)kelvin, id(ctrl_min_kelvin), id(ctrl_max_kelvin));
            id(ctrl_hue) = std::clamp<int32_t>(hue, 0, 359);
            id(ctrl_min_temp) = (int)min_temp_x10;
            id(ctrl_max_temp) = std::max(id(ctrl_min_temp), (int)max_temp_x10);
            id(ctrl_temp_step) = std::max(1, (int)temp_step_x10);
            id(ctrl_temp) = std::clamp((int)temp_x10, id(ctrl_min_temp), id(ctrl_max_temp));
            id(ctrl_min_humidity) = std::max(0, (int)min_humidity);
            id(ctrl_max_humidity) = std::max(id(ctrl_min_humidity), (int)max_humidity);
            id(ctrl_humidity_step) = std::max(1, (int)humidity_step);
            id(ctrl_humidity) = std::clamp((int)humidity, id(ctrl_min_humidity), id(ctrl_max_humidity));
            id(ctrl_temp_unit) = temp_unit == "F" ? "F" : "C";
            std::string remaining = modes;
            while (!remaining.empty() && id(ctrl_modes).size() < 12) {
              auto sep = remaining.find('|');
              auto value = remaining.substr(0, sep);
              if (!value.empty()) id(ctrl_modes).push_back(value);
              if (sep == std::string::npos) break;
              remaining = remaining.substr(sep + 1);
            }
            id(ctrl_mode_index) = 0;
            for (size_t i = 0; i < id(ctrl_modes).size(); i++)
              if (id(ctrl_modes)[i] == current_mode) id(ctrl_mode_index) = (int)i;
            id(last_input) = millis();

    - action: control_error
      description: Show a control update error
      variables:
        message: string
      then:
        - lambda: |-
            id(control_loading) = false;
            id(feedback_mode) = 3;
            id(feedback_message) = message.substr(0, 80);
            id(feedback_started) = millis();

    - action: set_menu_status
      description: Update the live Home Assistant state for a menu entry
      variables:
        slot: int
        status: string
      then:
        - lambda: |-
            if (slot >= 0 && slot < 32) id(menu_states)[slot] = status.substr(0, 12);

    - action: set_menu_count
      description: Set the number of active entries (0 to 32)
      variables:
        count: int
      then:
        - lambda: |-
            id(menu_length) = static_cast<int>(std::clamp<int32_t>(count, 0, 32));
            id(current_page) = "";
            id(cursor) = 0;
            id(transition_direction) = 0;
            id(control_open) = false;
            id(control_loading) = false;
            // Passive configuration sync must not wake a sleeping device.

    - action: set_base_led
      description: Change the persistent LED color (RGB values 0 to 255)
      variables:
        red: int
        green: int
        blue: int
      then:
        - lambda: |-
            id(base_red) = static_cast<int>(std::clamp<int32_t>(red, 0, 255));
            id(base_green) = static_cast<int>(std::clamp<int32_t>(green, 0, 255));
            id(base_blue) = static_cast<int>(std::clamp<int32_t>(blue, 0, 255));
        - if:
            condition:
              lambda: 'return !id(led_busy);'
            then:
              - script.execute: restore_led

    - action: play_led_animation
      description: Play a temporary LED animation (notify or identify)
      variables:
        animation: string
      then:
        - if:
            condition:
              lambda: 'return !id(led_busy) && animation == "notify";'
            then:
              - script.execute: notify_led
        - if:
            condition:
              lambda: 'return !id(led_busy) && animation == "identify";'
            then:
              - script.execute: identify_led

    - action: set_sleep_timeout
      description: Set OLED and LED idle timeout (seconds; 0 disables sleep)
      variables:
        seconds: int
      then:
        - number.set:
            id: sleep_timeout_number
            value: !lambda 'return static_cast<float>(std::clamp<int32_t>(seconds, 0, 3600));'

    - action: set_user_settings
      description: Apply device-local display and input preferences
      variables:
        language: string
        font_size: string
        direct_edit: bool
        brightness_step: int
        encoder_inverted: bool
        animations: bool
        oled_contrast: int
        offline_cache: bool
      then:
        - lambda: |-
            id(ui_language) = language == "en" ? "en" : "fr";
            id(ui_font_size) = font_size == "small" ? "small" : "normal";
            id(ui_direct_edit) = direct_edit;
            id(ui_brightness_step) = brightness_step == 1 || brightness_step == 10 ? brightness_step : 5;
            id(ui_encoder_inverted) = encoder_inverted;
            id(ui_animations) = animations;
            id(ui_contrast) = std::clamp<int32_t>(oled_contrast, 1, 100);
            id(ui_offline_cache) = offline_cache;
            id(oled).set_contrast(id(ui_contrast) / 100.0f);

    - action: set_extension_status
      description: Report the latest integration synchronization time
      variables:
        last_update: string
      then:
        - lambda: |-
            id(last_extension_seen) = millis();
            id(extension_last_update).publish_state(last_update.substr(0, 48));
            // Final commit: all menu data and options have been sent by HA.
            id(menu_synced) = true;

    - action: extension_heartbeat
      description: Keep the integration connectivity diagnostic current
      then:
        - lambda: id(last_extension_seen) = millis();
        - script.execute: send_diagnostics

    - action: action_result
      description: Report success or failure of a selected menu action
      variables:
        item_id: string
        success: bool
        message: string
      then:
        - if:
            condition:
              lambda: 'return !id(pending_item).empty() && id(pending_item) == item_id;'
            then:
              - script.stop: pending_timeout
              - lambda: |-
                  id(pending_item).clear();
                  if (!id(feedback_suppressed)) {
                    id(feedback_mode) = success ? 2 : 3;
                    id(feedback_message) = message.substr(0, 96);
                    id(feedback_started) = millis();
                  }
              - if:
                  condition:
                    lambda: 'return success;'
                  then:
                    - script.execute: success_led
                  else:
                    - script.execute: error_led

ota:
  - platform: esphome
    password: !secret ota_password

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true
  frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: title_font
    size: 10
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Roboto"
    id: menu_font
    size: 11
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Roboto"
    id: footer_font
    size: 8
    glyphsets:
      - GF_Latin_Core

